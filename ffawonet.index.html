<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFAWONET PLUS • Live TV</title>

<style>
:root{
  --bg:#070b16;
  --panel:#0e162b;
  --panel2:#111c33;
  --accent:#00d4ff;
  --text:#e9f1ff;
  --muted:#93a4c7;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:radial-gradient(circle at top, #0f1b35, var(--bg));
  color:var(--text);
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  background:rgba(10,15,30,0.9);
  backdrop-filter: blur(10px);
  border-bottom:1px solid #1f2a44;
}

.brand{
  font-weight:bold;
  color:var(--accent);
  letter-spacing:1px;
}

.live{
  background:#ff2d2d;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}

/* LAYOUT */
.app{
  display:flex;
  height:calc(100vh - 55px);
}

/* LEFT CATEGORY BAR */
.categories{
  width:70px;
  background:var(--panel);
  border-right:1px solid #1f2a44;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:10px;
}

.cat{
  width:50px;
  height:50px;
  margin:8px 0;
  background:var(--panel2);
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:0.2s;
  font-size:11px;
  color:var(--muted);
}

.cat:hover{
  transform:scale(1.1);
  background:var(--accent);
  color:black;
}

/* CHANNEL LIST */
.channels{
  width:280px;
  background:var(--panel);
  border-right:1px solid #1f2a44;
  overflow:auto;
}

.channel{
  padding:14px;
  border-bottom:1px solid #1f2a44;
  cursor:pointer;
  transition:0.2s;
}

.channel:hover{
  background:#162646;
}

.channel.active{
  background:linear-gradient(90deg, var(--accent), transparent);
  color:black;
  font-weight:bold;
}

.badge{
  font-size:10px;
  padding:2px 6px;
  background:#ff2d2d;
  border-radius:10px;
  margin-left:8px;
}

/* MAIN AREA */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* PLAYER */
.player{
  flex:2;
  position:relative;
  background:black;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.7);
}

.player iframe{
  width:100%;
  height:100%;
  border:none;
}

/* LIVE INFO OVERLAY */
.overlay{
  position:absolute;
  bottom:15px;
  left:15px;
  background:rgba(0,0,0,0.5);
  padding:10px 14px;
  border-left:3px solid var(--accent);
  backdrop-filter: blur(10px);
}

/* EPG */
.epg{
  flex:1;
  background:var(--panel);
  overflow:auto;
  border-top:1px solid #1f2a44;
}

.epg-item{
  display:flex;
  justify-content:space-between;
  padding:12px 14px;
  border-bottom:1px solid #1f2a44;
  transition:0.2s;
}

.epg-item:hover{
  background:#15243f;
}

.epg-active{
  background:rgba(0,212,255,0.15);
  border-left:4px solid var(--accent);
}

.time{
  color:var(--accent);
  width:70px;
}

/* RESPONSIVE */
@media(max-width:900px){
  .categories{display:none;}
  .channels{width:40%;}
}
</style>
</head>

<body>

<div class="header">
  <div class="brand">FFAWONET PLUS • BROADCAST NETWORK</div>
  <div class="live">● LIVE</div>
</div>

<div class="app">

  <!-- CATEGORY BAR -->
  <div class="categories">
    <div class="cat">SDA</div>
    <div class="cat">Youth</div>
    <div class="cat">Choir</div>
    <div class="cat">Intl</div>
  </div>

  <!-- CHANNELS -->
  <div class="channels" id="channelList"></div>

  <!-- MAIN -->
  <div class="main">

    <div class="player">
      <iframe id="player" src=""></iframe>

      <div class="overlay" id="nowPlaying">
        Now Playing: Loading...
      </div>
    </div>

    <div class="epg" id="epgList"></div>

  </div>

</div>

<script>
// =====================
// CHANNEL DATA
// =====================
const channels = [
  { name:"SDA Central Church", stream:"https://www.youtube.com/embed/1McnAuwX0Ls"live:true },
  { name:"Kampala Central SDA", stream:"https://www.youtube.com/embed/jfKfPfyJRdk/VIDEO_ID_2", live:true },
  { name:"Youth Worship Live", stream:"https://www.youtube.com/embed/VIDEO_ID_3", live:false },
  { name:"International SDA", stream:"https://www.youtube.com/embed/VIDEO_ID_4", live:true }
];

// =====================
// EPG DATA
// =====================
const epg = [
  {time:"08:00",title:"Morning Devotion"},
  {time:"10:00",title:"Sabbath School"},
  {time:"12:00",title:"Divine Service"},
  {time:"15:00",title:"Youth Worship"},
  {time:"18:00",title:"Evening Prayer"}
];

// =====================
// INIT CHANNELS
// =====================
const list = document.getElementById("channelList");
const player = document.getElementById("player");
const nowPlaying = document.getElementById("nowPlaying");

channels.forEach((c,i)=>{

  let div=document.createElement("div");
  div.className="channel";

  div.innerHTML=`${c.name} ${c.live?'<span class="badge">LIVE</span>':''}`;

  if(i===0){
    player.src=c.stream;
    div.classList.add("active");
    nowPlaying.innerText="Now Playing: "+c.name;
  }

  div.onclick=()=>{

    player.src=c.stream;
    nowPlaying.innerText="Now Playing: "+c.name;

    document.querySelectorAll(".channel")
    .forEach(x=>x.classList.remove("active"));

    div.classList.add("active");
  };

  list.appendChild(div);
});

// =====================
// EPG
// =====================
const epgList=document.getElementById("epgList");

epg.forEach((e,i)=>{

  let row=document.createElement("div");
  row.className="epg-item";

  row.innerHTML=`
    <div class="time">${e.time}</div>
    <div>${e.title}</div>
    <div>${i===0?"LIVE":"UP NEXT"}</div>
  `;

  if(i===0) row.classList.add("epg-active");

  epgList.appendChild(row);
});

</script>

</body>
</html>
